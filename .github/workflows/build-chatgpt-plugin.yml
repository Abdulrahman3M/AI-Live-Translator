name: Build ChatGPT Plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and test
        run: |
          python skills/ai-live-translator/scripts/validate.py
          python -m unittest discover -s skills/ai-live-translator/scripts/tests -v
      - name: Build installable ZIP
        run: python plugin/installation/build-chatgpt.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Live-Translator-ChatGPT-Plugin
          path: dist/*.zip
      - name: Publish tagged release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "AI Live Translator ${GITHUB_REF_NAME}" --notes "Installable ChatGPT ZIP; see README for Claude Code installation."
