name: Build AI Live Translator packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and test
        run: |
          python skills/ai-live-translator/scripts/validate.py
          python -m unittest discover -s skills/ai-live-translator/scripts/tests -v
      - name: Build all five release ZIPs
        run: |
          python plugin/installation/build-chatgpt.py
          python plugin/installation/build_release.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Live-Translator-${{ github.ref_name }}
          path: dist/*.zip
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          test -f "docs/releases/v$(cat VERSION).md"
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "AI Live Translator ${GITHUB_REF_NAME}" --notes-file "docs/releases/v$(cat VERSION).md"
